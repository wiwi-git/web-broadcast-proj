# 데스크톱 앱(app/) 배포 패키지를 Windows·macOS 러너에서 만든다.
# - 수동 실행(Actions → desktop → Run workflow): 패키지를 워크플로 결과물(artifact)로만 남긴다
# - `desktop-v*` 태그를 올리면: GitHub Release를 만들고 패키지를 붙인다.
#   다운로드 페이지(https://live.duse.dev/download/)는 최신 릴리스의 파일로 연결된다.
#
#   git tag desktop-v0.1.0 && git push origin desktop-v0.1.0
name: desktop

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest   # x64
            file: WebBroadcast-windows-x64.msi
          - os: macos-latest     # Apple Silicon(arm64)
            file: WebBroadcast-macos-arm64.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - uses: cargo-bins/cargo-binstall@main

      - name: dx 설치
        run: cargo binstall dioxus-cli@0.7.10 --no-confirm --force

      - name: 패키지 만들기 (서버 https://live.duse.dev)
        run: scripts/bundle-desktop.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: app/dist/${{ matrix.file }}
          if-no-files-found: error

      - name: 릴리스에 붙이기
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/dist/${{ matrix.file }}
