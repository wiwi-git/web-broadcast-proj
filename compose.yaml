# 개발:  docker compose up -d                 → PostgreSQL + MediaMTX (서버는 IDE/Gradle로 직접 실행)
# 배포:  docker compose --profile app up -d   → 위 + API 서버 + 변환 워커
#        워커 늘리기: docker compose --profile app up -d --scale worker=3   (ADR-0004)
#
# 휴대폰에서 송출하려면 .env에 PC의 LAN IP를 적는다 (.env.example 참고)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: webbroadcast
      POSTGRES_USER: webbroadcast
      POSTGRES_PASSWORD: webbroadcast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webbroadcast -d webbroadcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    # 유튜브 동시 송출을 ffmpeg로 중계하므로 ffmpeg가 든 이미지를 쓴다 (ADR-0007)
    image: bluenviron/mediamtx:1.21.3-ffmpeg
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./mediamtx/simulcast.sh:/simulcast.sh:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${LAN_IP:-}
      # 중계 스크립트가 유튜브 주소를 묻고 상태를 알리는 서버. 서버의 simulcast.relay-secret과 같은 값을 .env에 둔다
      SIMULCAST_SERVER_URL: ${SIMULCAST_SERVER_URL:-http://host.docker.internal:8180}
      SIMULCAST_RELAY_SECRET: ${SIMULCAST_RELAY_SECRET:-}
    ports:
      - "8888:8888"            # LL-HLS (Viewer)
      - "8889:8889"            # WHIP (Broadcaster)
      - "8189:8189/udp"        # WebRTC 미디어
      - "8189:8189/tcp"        # WebRTC 미디어 (UDP가 막힌 경우)
      - "127.0.0.1:9997:9997"  # 제어 API (Spring 전용)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 개발용 메일 수신기. 서버가 보낸 인증·비밀번호 재설정 메일을 http://localhost:8025 에서 본다
  # 서버 설정: MAIL_HOST=localhost, MAIL_PORT=1025, MAIL_SMTP_AUTH=false, MAIL_STARTTLS=false (config/local.properties.example)
  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # 받은 메일 화면

  # 유튜브 대신 동시 송출을 받아 보는 로컬 RTMP 수신기. 서버의 simulcast.youtube-url을 rtmp://rtmp-sink:1935/live2로 바꿔 쓴다
  #   docker compose --profile simulcast-test up -d rtmp-sink
  rtmp-sink:
    profiles: [simulcast-test]
    image: bluenviron/mediamtx:1.21.3
    environment:
      MTX_WEBRTC: "no"
      MTX_HLS: "no"
      MTX_SRT: "no"

  server:
    profiles: [app]
    build: ./server
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webbroadcast
      DB_USERNAME: webbroadcast
      DB_PASSWORD: webbroadcast
      MEDIAMTX_API_URL: http://mediamtx:9997
      SIMULCAST_ENCRYPTION_KEY: ${SIMULCAST_ENCRYPTION_KEY:-}
      SIMULCAST_RELAY_SECRET: ${SIMULCAST_RELAY_SECRET:-}
      # 변환은 worker 컨테이너가 맡는다
      VIDEO_WORKER_ENABLED: "false"
    ports:
      - "8180:8180"
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # 변환 워커: 같은 이미지를 웹 서버 없이 띄운다. 업로드 파일은 media-data 볼륨으로 API 서버와 나눠 쓴다
  worker:
    profiles: [app]
    build: ./server
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://postgres:5432/webbroadcast
      DB_USERNAME: webbroadcast
      DB_PASSWORD: webbroadcast
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
