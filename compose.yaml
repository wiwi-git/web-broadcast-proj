# 개발:  docker compose up -d                 → PostgreSQL + MediaMTX (서버는 IDE/Gradle로 직접 실행)
# 배포:  docker compose --profile app up -d   → 위 + API 서버 + 변환 워커
#        워커 늘리기: docker compose --profile app up -d --scale worker=3   (ADR-0004)
#
# 휴대폰에서 송출하려면 .env에 PC의 LAN IP를 적는다 (.env.example 참고)
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: webbroadcast
      POSTGRES_USER: webbroadcast
      POSTGRES_PASSWORD: webbroadcast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webbroadcast -d webbroadcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.21.3
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${LAN_IP:-}
    ports:
      - "8888:8888"            # LL-HLS (Viewer)
      - "8889:8889"            # WHIP (Broadcaster)
      - "8189:8189/udp"        # WebRTC 미디어
      - "8189:8189/tcp"        # WebRTC 미디어 (UDP가 막힌 경우)
      - "127.0.0.1:9997:9997"  # 제어 API (Spring 전용)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  server:
    profiles: [app]
    build: ./server
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webbroadcast
      DB_USERNAME: webbroadcast
      DB_PASSWORD: webbroadcast
      MEDIAMTX_API_URL: http://mediamtx:9997
      # 변환은 worker 컨테이너가 맡는다
      VIDEO_WORKER_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  # 변환 워커: 같은 이미지를 웹 서버 없이 띄운다. 업로드 파일은 media-data 볼륨으로 API 서버와 나눠 쓴다
  worker:
    profiles: [app]
    build: ./server
    environment:
      SPRING_PROFILES_ACTIVE: worker
      DB_URL: jdbc:postgresql://postgres:5432/webbroadcast
      DB_USERNAME: webbroadcast
      DB_PASSWORD: webbroadcast
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
