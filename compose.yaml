# 개발:  docker compose up -d                 → PostgreSQL만 실행 (서버는 IDE/Gradle로 직접 실행)
# 배포:  docker compose --profile app up -d   → PostgreSQL + 서버 컨테이너
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: webbroadcast
      POSTGRES_USER: webbroadcast
      POSTGRES_PASSWORD: webbroadcast
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webbroadcast -d webbroadcast"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    profiles: [app]
    build: ./server
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/webbroadcast
      DB_USERNAME: webbroadcast
      DB_PASSWORD: webbroadcast
    ports:
      - "8080:8080"
    volumes:
      - media-data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  media-data:
