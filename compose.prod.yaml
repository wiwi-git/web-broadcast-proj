# 운영 서버 전용 덮어쓰기 (OCI, https://live.duse.dev). README "운영 서버 배포" 참고.
# 실행: docker compose -f compose.yaml -f compose.prod.yaml --profile app up -d --build
# 비밀값과 공인 IP는 같은 폴더의 .env에 둔다 (git에 없음, deploy/env.example 참고)
services:
  postgres:
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
    ports: !reset []          # 외부로 열지 않는다

  mediamtx:
    restart: unless-stopped
    environment:
      MTX_WEBRTCADDITIONALHOSTS: ${PUBLIC_IP:?}
      # 같은 compose 네트워크의 서버를 이름으로 부른다
      MTX_AUTHHTTPADDRESS: http://server:8180/api/media-server/auth
      SIMULCAST_SERVER_URL: http://server:8180
    ports: !override
      - "127.0.0.1:8888:8888"  # HLS → Caddy가 /hls 로 넘긴다
      - "127.0.0.1:8889:8889"  # WHIP → Caddy가 /whip 으로 넘긴다
      - "8189:8189/udp"        # WebRTC 미디어 (공개)
      - "8189:8189/tcp"
      - "127.0.0.1:9997:9997"

  server:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
      # 토스페이먼츠 테스트 키. 없으면 후원만 막힌다
      TOSS_CLIENT_KEY: ${TOSS_CLIENT_KEY:-}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-}
    ports: !override
      - "127.0.0.1:8180:8180"  # Caddy가 /api, /media 로 넘긴다

  worker:
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD:?}
