# 라이브 미디어 서버 (ADR-0002). WebRTC 연결을 직접 들고 있어서 늘리지 않고 한 대로 둔다.
# 설정은 mediamtx/mediamtx.yml과 동시 송출 중계 스크립트 mediamtx/simulcast.sh를 그대로 쓴다.
# k8s/up.sh(로컬)와 deploy/k3s/deploy.sh(OCI)가 두 파일로 ConfigMap mediamtx-config를 만든다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediamtx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mediamtx
  template:
    metadata:
      labels:
        app: mediamtx
    spec:
      containers:
        - name: mediamtx
          # 유튜브 동시 송출을 ffmpeg로 중계한다 (ADR-0007)
          image: bluenviron/mediamtx:1.21.3-ffmpeg
          env:
            # 송출 허가는 서버 Service(여러 Pod 중 아무나)에 묻는다
            - name: MTX_AUTHHTTPADDRESS
              value: http://server:8180/api/media-server/auth
            # 동시 송출 중계 스크립트가 유튜브 주소를 묻고 상태를 알리는 곳
            - name: SIMULCAST_SERVER_URL
              value: http://server:8180
          # 서버와 같은 중계 비밀 값 (선택). 없으면 동시 송출만 하지 않는다
          envFrom:
            - secretRef: { name: simulcast, optional: true }
          ports:
            - containerPort: 8888
            - containerPort: 8889
            - containerPort: 8189
              protocol: UDP
            - containerPort: 8189
              protocol: TCP
            - containerPort: 9997
          volumeMounts:
            - name: config
              mountPath: /mediamtx.yml
              subPath: mediamtx.yml
            - name: config
              mountPath: /simulcast.sh
              subPath: simulcast.sh
      volumes:
        - name: config
          configMap:
            name: mediamtx-config
            # simulcast.sh를 실행할 수 있게 한다
            defaultMode: 0755
---
# 브라우저가 닿는 포트. Docker Desktop은 LoadBalancer를 localhost에 연다.
# OCI 오버레이는 WebRTC(8189)를 Service에서 빼고 Pod의 hostPort로 직접 연다
apiVersion: v1
kind: Service
metadata:
  name: mediamtx
spec:
  type: LoadBalancer
  selector:
    app: mediamtx
  ports:
    - name: hls
      port: 8888
    - name: whip
      port: 8889
    - name: webrtc-udp
      port: 8189
      protocol: UDP
    - name: webrtc-tcp
      port: 8189
      protocol: TCP
---
# 제어 API는 클러스터 안의 서버만 쓴다
apiVersion: v1
kind: Service
metadata:
  name: mediamtx-api
spec:
  selector:
    app: mediamtx
  ports:
    - port: 9997
