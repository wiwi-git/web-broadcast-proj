# 로컬 쿠버네티스(Docker Desktop Kubernetes)용. 직접 적용하기보다 k8s/up.sh를 쓴다.
# 이미지 빌드, metrics-server 설치, MediaMTX 설정(ConfigMap) 생성까지 해 준다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: webbroadcast

resources:
  - ../../base
  - db-credentials.yaml
  - worker-hpa.yaml

patches:
  - path: server-hpa-behavior.yaml
