spring.application.name=server

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webbroadcast}
spring.datasource.username=${DB_USERNAME:webbroadcast}
spring.datasource.password=${DB_PASSWORD:webbroadcast}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 업로드 상한 2GB (제목/설명 필드 여유분 포함)
spring.servlet.multipart.max-file-size=2GB
spring.servlet.multipart.max-request-size=2100MB
server.tomcat.max-swallow-size=-1

media.storage-root=${MEDIA_STORAGE_ROOT:./data}
media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
media.ffprobe-path=${FFPROBE_PATH:ffprobe}

mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}

# 로그인 세션은 PostgreSQL에 저장한다 (ADR-0003). 테이블은 Flyway가 만든다
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never
