spring.application.name=server

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webbroadcast}
spring.datasource.username=${DB_USERNAME:webbroadcast}
spring.datasource.password=${DB_PASSWORD:webbroadcast}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 업로드 상한. 파일 하나는 video.upload.max-file-size(기본 500MB)로 확인하고, multipart는 제목·설명 여유분을 더해 조금 크게 둔다.
# User별 총용량(video.upload.quota-per-user, 기본 2GB)과 디스크 여유(video.upload.min-free-disk, 기본 5GB)도 VideoUploadProperties 참고
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=510MB
server.tomcat.max-swallow-size=-1

media.storage-root=${MEDIA_STORAGE_ROOT:./data}
media.ffmpeg-path=${FFMPEG_PATH:ffmpeg}
media.ffprobe-path=${FFPROBE_PATH:ffprobe}

mediamtx.api-url=${MEDIAMTX_API_URL:http://localhost:9997}

# 로그인 세션은 PostgreSQL에 저장한다 (ADR-0003). 테이블은 Flyway가 만든다
spring.session.timeout=30m
spring.session.jdbc.initialize-schema=never

# 토스페이먼츠 API 개별 연동 키(통합결제창). 테스트 키(test_)만 받는다.
# 본인 키를 config/local.properties(git 제외, local.properties.example 참고)나 환경변수로 넣는다.
# 키가 없으면 후원 결제만 쓸 수 없다
toss.client-key=${TOSS_CLIENT_KEY:}
toss.secret-key=${TOSS_SECRET_KEY:}
toss.api-url=${TOSS_API_URL:https://api.tosspayments.com}
# 유튜브 동시 송출 (ADR-0007). 두 값이 모두 있어야 쓸 수 있다. 키를 config/local.properties나 환경변수로 넣는다
# encryption-key: YouTube Key를 DB에 암호화할 키 (openssl rand -base64 32). 바꾸면 저장된 키를 다시 등록해야 한다
# relay-secret: MediaMTX 중계 스크립트와 나눠 쓰는 값. compose/k8s의 MediaMTX에도 같은 값을 준다
# youtube-url: 로컬 확인 때는 RTMP 수신기(compose의 rtmp-sink)로 바꾼다
simulcast.encryption-key=${SIMULCAST_ENCRYPTION_KEY:}
simulcast.relay-secret=${SIMULCAST_RELAY_SECRET:}
simulcast.youtube-url=${SIMULCAST_YOUTUBE_URL:rtmps://a.rtmp.youtube.com/live2}

# 쿠버네티스가 Pod를 살피는 헬스 체크만 연다 (/actuator/health/liveness, /readiness)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
spring.config.import=optional:file:./config/local.properties

# 8080은 다른 로컬 프로젝트와 자주 겹쳐서 8180을 쓴다
server.port=8180
